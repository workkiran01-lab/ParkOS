name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'booking/**'
      - 'design/**'
      - 'hardening/**'
      - 'fix/remaining-defects'

env:
  SUPABASE_TELEMETRY_DISABLED: '1'
  PARKOS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Reading a job log needs repo auth; annotations are served by the public
      # check-runs API. This step has failed in under a second on every run
      # since it was introduced and the reason has never been visible off the
      # runner, so re-emit its output as an annotation. Exit code preserved.
      - name: Typecheck edge functions
        shell: bash
        run: |
          set +e
          out=$(npm run typecheck:edge 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ $rc -ne 0 ]; then
            enc=$(printf '%s' "$out" | tail -c 3000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=typecheck:edge exit $rc::$enc"
          fi
          exit $rc
      - run: npm test
      - run: npm run test:webhook-mutations
      - run: npm run build
      - run: git diff --exit-code -- src/routeTree.gen.ts

  database:
    name: Local database verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:local-db
      - run: npx supabase start --exclude studio,imgproxy,mailpit,vector,logflare
      - run: npx supabase db reset --local
      # supabase status -o env shell-quotes every value; GITHUB_ENV keeps the
      # quotes literally. shell: bash is load-bearing: the default shell is
      # `bash -e` with no pipefail, so this pipe reported sed's exit status and
      # a failing `supabase status` would append nothing while still going
      # green. Only test:concurrency, the first reader of API_URL, would notice.
      # Key names are annotated; the values include the service-role key.
      - name: Export local Supabase env
        shell: bash
        run: |
          npx supabase status -o env \
            | sed 's/="\(.*\)"$/=\1/' > "$RUNNER_TEMP/supabase.env"
          echo "::notice title=supabase status keys::$(cut -d= -f1 "$RUNNER_TEMP/supabase.env" | tr '\n' ' ')"
          cat "$RUNNER_TEMP/supabase.env" >> "$GITHUB_ENV"
      - run: npm run db:seed:dev
      - name: Report local privilege model
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 "$PARKOS_TEST_DATABASE_URL" <<'SQL'
          select rolname, rolbypassrls from pg_roles
            where rolname in ('anon', 'authenticated', 'service_role');
          select defaclrole::regrole as owner,
                 defaclnamespace::regnamespace as schema,
                 defaclobjtype as object_type, defaclacl as privileges
            from pg_default_acl order by 1, 2, 3;
          select grantee, table_name, privilege_type
            from information_schema.role_table_grants
            where table_schema = 'public' and grantee = 'service_role'
            order by table_name, privilege_type;
          SQL
      - name: Run all 17 SQL verifiers and prove fixture cleanup
        run: npm run test:db:all
      - run: npm run test:queries
      - run: npm run test:correction-race
      - run: npm run test:last-admin
      - name: Concurrency test
        shell: bash
        run: |
          set +e
          out=$(npm run test:concurrency 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ $rc -ne 0 ]; then
            enc=$(printf '%s' "$out" | tail -c 3000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:concurrency exit $rc::$enc"
          fi
          exit $rc
      - if: always()
        run: npx supabase stop --no-backup

  financial:
    name: Local financial verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:local-db
      - run: npx supabase start --exclude studio,imgproxy,mailpit,vector,logflare
      - run: npx supabase db reset --local
      # See the database job: shell: bash supplies the missing pipefail.
      - name: Export local Supabase env
        shell: bash
        run: |
          npx supabase status -o env \
            | sed 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"
      - run: npm run db:seed:dev
      - run: npm run test:financial
      - run: npm run test:sql-mutations
      - if: always()
        run: npx supabase stop --no-backup
